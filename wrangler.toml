name = "xiqing-agri-website"
compatibility_date = "2026-08-25"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"

# Optional standalone Worker configuration; production uses Pages dashboard bindings.
# Existing empty bucket verified private on 2026-09-06; no media migration required.
[[r2_buckets]]
binding = "MEDIA_PRIVATE_BUCKET"
bucket_name = "xiqing-agri-media"

[[d1_databases]]
binding = "DB"
database_name = "xiqing-agri-media"
database_id = "0bb78b95-7d03-4735-810c-0dad95ea0b55"

[vars]
DEFAULT_TIMEZONE_OFFSET = "+08:00"

# MEDIA_UPLOAD_TOKEN must be added as an encrypted Cloudflare secret.
